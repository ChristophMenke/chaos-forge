name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node caches npm automatically since v5. The next step drops
          # the lockfile on purpose to re-resolve the linux bindings, so a
          # warmed cache would work against that intent.
          package-manager-cache: false

      - name: Install dependencies (fresh resolve for linux bindings)
        run: rm package-lock.json && npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
